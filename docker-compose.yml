services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voting}
      POSTGRES_USER: ${POSTGRES_USER:-voting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voting_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
